[browser]
gatherUsageStats = false

[client]
toolbarMode = 'minimal'
showErrorDetails = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"
maxMessageSize = 50
enableWebsocketCompression = true

[theme]
base = 'dark'
primaryColor = '#1f77b4'
