services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleicoes2026_painel
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/db/eleicoes.db
    deploy:
      resources:
        limits:
          cpus: '1.8'
          memory: 3200M
        reservations:
          cpus: '0.2'
          memory: 300M
    volumes:
      - ./db:/app/db
      - ./web:/app/web
      - ./index.html:/usr/local/lib/python3.11/site-packages/streamlit/static/index.html:ro
      - ./og_preview.png:/usr/local/lib/python3.11/site-packages/streamlit/static/og_preview.png:ro
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: eleicoes2026_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 30M
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - painel
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
